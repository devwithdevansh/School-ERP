name: school_connect
description: "School Connect - white-label parent & teacher companion app for School ERP."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  get: ^4.6.6

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities & fonts
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^2.7.0
  shimmer: ^3.0.0
  animations: ^2.0.11

  cupertino_icons: ^1.0.8

  # PDF (receipts)
  pdf: ^3.10.8
  printing: ^5.13.4
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # Push notifications (optional: only active once Firebase is configured, see README)
  firebase_core: ^3.10.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.4

  # Audio
  audioplayers: ^5.2.1

  # Online payments (optional: needs RAZORPAY_KEY_ID in .env)
  razorpay_flutter: ^1.3.7
  flutter_dotenv: ^6.0.1
  sms_autofill: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#4f46e5"
  adaptive_icon_foreground: assets/images/app_icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/images/
    - assets/sounds/
    - assets/animations/
