# Keep Gradle under the machine's available RAM. The previous 8G heap caused the JVM
# to crash immediately on this laptop during startup.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
# Local JDK path should be configured in ~/.gradle/gradle.properties if needed, not committed
# org.gradle.java.home=C:\\Users\\HP\\jdk17\\jdk-17.0.20.1+1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: the project and the pub cache are often on different drives, which breaks Kotlin incremental caches
kotlin.incremental=false
